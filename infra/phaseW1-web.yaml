AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Leasyd web app (W1): a private S3 bucket with the built app, served by CloudFront. CloudFront also
  routes /v1/* to the API (obs-phaseT2), so the browser talks to one origin: no CORS, and the API
  keeps its own authorizers. infra/deploy-phaseW1.sh builds and uploads the app.

Parameters:
  ApiDomain:
    Type: String
    Description: "API Gateway host of obs-phaseT2 (e.g. abc123.execute-api.us-east-1.amazonaws.com)."
  ApiStagePath:
    Type: String
    Default: /ingest
    Description: The API stage, as a path.
  AppHostName:
    Type: String
    Default: ""
    Description: Public host name of the web app, e.g. app.leasyd.com (obs-dns). Empty = CloudFront's own name only.
  CertificateArn:
    Type: String
    Default: ""
    Description: obs-dns certificate covering AppHostName (in us-east-1, as CloudFront requires).
  HostedZoneId:
    Type: String
    Default: ""

Conditions:
  CustomDomain: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "obs-web-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: W1 }

  WebAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: obs-web
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Only this distribution may read the bucket.
  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" }

  # The managed security headers plus a Content-Security-Policy: the page runs only its own
  # scripts (no inline or third-party ones), talks only to its own origin (the API is under /v1)
  # and Cognito, and can't be framed by another site.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "obs-web-security-${AWS::Region}"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: !Sub "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://cognito-idp.${AWS::Region}.amazonaws.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true, Override: true }
          XSSProtection: { ModeBlock: true, Protection: true, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Leasyd web app and API
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [CustomDomain, [!Ref AppHostName], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - CustomDomain
          - { AcmCertificateArn: !Ref CertificateArn, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref AWS::NoValue
        Origins:
          - Id: app
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebAccess.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Ref ApiDomain
            OriginPath: !Ref ApiStagePath
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2], OriginReadTimeout: 30 }
        DefaultCacheBehavior:
          TargetOriginId: app
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
        CacheBehaviors:
          - PathPattern: /v1/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # Managed-AllViewerExceptHostHeader (keeps Authorization, x-api-key)
          # The app's settings must never be cached stale.
          - PathPattern: /config.json
            TargetOriginId: app
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: W1 }

  AppRecord:
    Type: AWS::Route53::RecordSet
    Condition: CustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AppHostName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's zone, the same for every distribution

Outputs:
  WebUrl:
    Value: !If [CustomDomain, !Sub "https://${AppHostName}", !Sub "https://${Distribution.DomainName}"]
  WebBucketName:
    Value: !Ref WebBucket
  DistributionId:
    Value: !Ref Distribution
