AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phases 4-5 query engine for the S3-native observability platform:
  obs-query (coordinator: index lookup, split the files, fan out, merge)
  and obs-query-worker (reads one chunk of the tenant's files with
  tenant-scoped credentials and runs the query in DuckDB). Both run as
  obs-query, which reaches tenant data only through obs-tenant-reader.
  Requires obs-phase0 (redeployed for Phase 4), obs-phase2 and obs-phase3.
  Deploy with infra/deploy-phase4.sh.

Parameters:
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Full days of data kept (plus today); the query API never reads earlier. Same as obs-phaseT5's.
  MaxWorkers:
    Type: Number
    Default: 64
    Description: Most workers one query fans out to.
  BytesPerWorker:
    Type: Number
    Default: 67108864
    Description: >
      Target bytes of files per worker (64 MB). Fewer bytes, more workers in
      parallel: faster, at about the same total cost (billed per GB-second).
  SqlInPlaceAccounts:
    Type: String
    Default: ""
    Description: >
      Accounts (comma-separated, * = all) whose SQL questions, when run by one worker, read Parquet in
      place (only the columns and row groups needed) instead of downloading whole files. docs/perf-flags.md.
  SqlScanFanoutAccounts:
    Type: String
    Default: ""
    Description: >
      Accounts (comma-separated, * = all) whose SQL questions use the scan fan-out: many workers read the
      files, keeping only what the question can use, and the question runs over that. docs/perf-flags.md.
  ResultCacheAccounts:
    Type: String
    Default: ""
    Description: Accounts (comma-separated, * = all) whose answers are kept for repeat questions (30 s for recent data). docs/perf-flags.md.
  WarmSchedule:
    Type: String
    Default: "cron(0/5 6-18 ? * MON-FRI *)"
    Description: When to keep query containers warm (UTC; default every 5 min, weekdays ~07:00-19:00 London). "" = never.
  WarmCoordinators:
    Type: Number
    Default: 3
    Description: obs-query containers kept warm (obs-query-api gets three pings each time too).
  WarmWorkers:
    Type: Number
    Default: 128
    Description: obs-query-worker containers kept warm.
  ReadMode:
    Type: String
    Default: ranges
    AllowedValues: [ranges, download]
    Description: ranges reads only the Parquet columns a query needs, in place; download fetches whole files.

  WorkerConcurrency:
    Type: Number
    Default: 1000
    MinValue: 0
    Description: >
      Most obs-query-worker instances at once, all tenants (0 = no cap). A query fans out to at
      most MaxWorkers; the 60-day peak (a stress test) was 849. Reserved, so it is also kept
      apart from ingest's share.
  ApiConcurrency:
    Type: Number
    Default: 300
    MinValue: 0
    Description: Most obs-query-api instances at once (0 = no cap); the 60-day peak was 28.
  CoordinatorConcurrency:
    Type: Number
    Default: 400
    MinValue: 0
    Description: >
      Most obs-query instances at once (0 = no cap): every app and API query runs here (obs-query-api
      waits for it, capped at 300), plus alerts, the AI SRE and MCP (60-day peak 8).

Conditions:
  CapWorkers: !Not [!Equals [!Ref WorkerConcurrency, 0]]
  CapApi: !Not [!Equals [!Ref ApiConcurrency, 0]]
  CapCoordinator: !Not [!Equals [!Ref CoordinatorConcurrency, 0]]
  Warm: !Not [!Equals [!Ref WarmSchedule, ""]]

Resources:
  CoordinatorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/obs-query
      RetentionInDays: 14

  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/obs-query-worker
      RetentionInDays: 14

  CoordinatorFunction:
    Type: AWS::Lambda::Function
    DependsOn: CoordinatorLogGroup
    Properties:
      FunctionName: obs-query
      ReservedConcurrentExecutions: !If [CapCoordinator, !Ref CoordinatorConcurrency, !Ref "AWS::NoValue"]
      Description: Runs a query over one tenant's data (lookup, fan out, merge)
      Runtime: python3.12
      Architectures: [arm64]
      Handler: query.handler
      Code: ../services/compaction/build
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-query"
      MemorySize: 2048
      Timeout: 300
      EphemeralStorage: { Size: 4096 }
      Environment:
        Variables:
          BUCKET: !Sub "obs-data-${AWS::AccountId}-${AWS::Region}"
          INDEX_TABLE: obs-index
          TENANT_READER_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
          QUERY_WORKER_FUNCTION: obs-query-worker
          QUERY_MAX_WORKERS: !Ref MaxWorkers
          QUERY_BYTES_PER_WORKER: !Ref BytesPerWorker
          RETENTION_DAYS: !Ref RetentionDays
          SQL_IN_PLACE_ACCOUNTS: !Ref SqlInPlaceAccounts
          SQL_SCAN_FANOUT_ACCOUNTS: !Ref SqlScanFanoutAccounts
          RESULT_CACHE_ACCOUNTS: !Ref ResultCacheAccounts
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "4" }

  WorkerFunction:
    Type: AWS::Lambda::Function
    DependsOn: WorkerLogGroup
    Properties:
      FunctionName: obs-query-worker
      ReservedConcurrentExecutions: !If [CapWorkers, !Ref WorkerConcurrency, !Ref "AWS::NoValue"]
      Description: Reads one chunk of a tenant's files and runs the query in DuckDB
      Runtime: python3.12
      Architectures: [arm64]
      Handler: query.worker
      Code: ../services/compaction/build
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-query"
      MemorySize: 3008    # CPU and network scale with memory
      Timeout: 300
      EphemeralStorage: { Size: 10240 }
      Environment:
        Variables:
          BUCKET: !Sub "obs-data-${AWS::AccountId}-${AWS::Region}"
          INDEX_TABLE: obs-index
          TENANT_READER_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
          QUERY_READ_MODE: !Ref ReadMode
          # Long queries run here as jobs (obs-query-api hands them over), fanning out like obs-query.
          QUERY_WORKER_FUNCTION: obs-query-worker
          QUERY_MAX_WORKERS: !Ref MaxWorkers
          QUERY_BYTES_PER_WORKER: !Ref BytesPerWorker
          RETENTION_DAYS: !Ref RetentionDays
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "4" }

  # Jobs ("async": true) start obs-query asynchronously. Never retried (a retry runs and charges the
  # query again), and an event not started within LATE_START_S (query.py) is dropped: the job
  # couldn't finish in time, and its polls say 504. Lambda's defaults were 2 retries, kept 6 hours.
  CoordinatorAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref CoordinatorFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 60

  # Jobs (long queries) are started asynchronously: a failed one is reported, never retried.
  WorkerAsyncConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref WorkerFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 0
      MaximumEventAgeInSeconds: 300

  # ---------- Customer query API (POST /v1/query, routed by obs-phaseT2) ----------

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/obs-query-api
      RetentionInDays: 14

  LimitsRefusedFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiLogGroup
      # services/shared/limits.py: a limit refused because obs-tenants couldn't be read for too long
      FilterPattern: '{ $.limits_fallback = * && $.decision = "refuse" }'
      MetricTransformations:
        - { MetricNamespace: obs, MetricName: LimitsRefused, MetricValue: "1", DefaultValue: 0 }

  ApiFunction:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: obs-query-api
      ReservedConcurrentExecutions: !If [CapApi, !Ref ApiConcurrency, !Ref "AWS::NoValue"]
      Description: POST /v1/query - runs a query for the tenant of the caller's read key
      Runtime: python3.12
      Architectures: [arm64]
      Handler: query.api
      Code: ../services/compaction/build
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-query"
      MemorySize: 2048
      Timeout: 30          # API Gateway gives up after 29 s
      EphemeralStorage: { Size: 4096 }
      Environment:
        Variables:
          BUCKET: !Sub "obs-data-${AWS::AccountId}-${AWS::Region}"
          INDEX_TABLE: obs-index
          TENANT_READER_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
          QUERY_WORKER_FUNCTION: obs-query-worker
          COORDINATOR_FUNCTION: obs-query
          QUERY_MAX_WORKERS: !Ref MaxWorkers
          QUERY_BYTES_PER_WORKER: !Ref BytesPerWorker
          RETENTION_DAYS: !Ref RetentionDays
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "Q1" }

  # Keeps containers ready (services/compaction/query.py, warm): the coordinator holds WarmCoordinators
  # coordinators and WarmWorkers workers busy for a moment; three pings hold three API containers.
  WarmRule:
    Type: AWS::Events::Rule
    Condition: Warm
    Properties:
      Name: obs-query-warm
      Description: Keeps query Lambda containers warm in business hours
      ScheduleExpression: !Ref WarmSchedule
      Targets:
        - Id: coordinator
          Arn: !GetAtt CoordinatorFunction.Arn
          Input: !Sub '{"warm": {"coordinators": ${WarmCoordinators}, "workers": ${WarmWorkers}}}'
        - { Id: api1, Arn: !GetAtt ApiFunction.Arn, Input: '{"warm": true}' }
        - { Id: api2, Arn: !GetAtt ApiFunction.Arn, Input: '{"warm": true}' }
        - { Id: api3, Arn: !GetAtt ApiFunction.Arn, Input: '{"warm": true}' }

  WarmCoordinatorPermission:
    Type: AWS::Lambda::Permission
    Condition: Warm
    Properties:
      FunctionName: !Ref CoordinatorFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmRule.Arn

  WarmApiPermission:
    Type: AWS::Lambda::Permission
    Condition: Warm
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WarmRule.Arn

Outputs:
  QueryFunction:
    Value: !Ref CoordinatorFunction
  QueryWorkerFunction:
    Value: !Ref WorkerFunction
