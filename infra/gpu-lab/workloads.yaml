# GPU lab workloads (infra/gpu-lab.sh): one of each situation the GPU and Kubernetes pages must show,
# on a node with 4 GPUs.
apiVersion: v1
kind: Namespace
metadata: { name: ml }
---
apiVersion: v1
kind: Namespace
metadata: { name: notebooks }
---
apiVersion: v1
kind: Namespace
metadata: { name: shop }
---
# 2 GPUs busy: an n-body simulation in a loop (team research)
apiVersion: apps/v1
kind: Deployment
metadata: { name: trainer, namespace: ml }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: trainer } }
  template:
    metadata: { labels: { app.kubernetes.io/name: trainer, team: research } }
    spec:
      runtimeClassName: nvidia
      containers:
        - name: trainer
          image: nvcr.io/nvidia/k8s/cuda-sample:nbody
          # one line a run: nbody's full output was ~7,000 lines a second (filled the daily cap in minutes)
          command: ["sh", "-c", "while true; do nbody -gpu -benchmark -numbodies=1024000 >/tmp/run.log 2>&1; tail -n 1 /tmp/run.log; sleep 1; done"]
          resources: { limits: { nvidia.com/gpu: 1 }, requests: { cpu: 500m, memory: 512Mi } }
---
# 1 GPU held but idle: a "notebook" that sleeps (team data-science)
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: jupyter-lab, namespace: notebooks }
spec:
  replicas: 1
  serviceName: jupyter-lab
  selector: { matchLabels: { app.kubernetes.io/name: jupyter } }
  template:
    metadata: { labels: { app.kubernetes.io/name: jupyter, team: data-science } }
    spec:
      runtimeClassName: nvidia
      containers:
        - name: notebook
          image: nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04
          command: ["sleep", "infinity"]
          resources: { limits: { nvidia.com/gpu: 1, memory: 1Gi }, requests: { cpu: 100m, memory: 256Mi } }
---
# Waiting for GPUs: wants 2, only 1 is free (team research)
apiVersion: batch/v1
kind: Job
metadata: { name: embeddings-batch, namespace: ml }
spec:
  backoffLimit: 0
  template:
    metadata: { labels: { app.kubernetes.io/name: embeddings-batch, team: research } }
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      containers:
        - name: embed
          image: nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04
          command: ["sleep", "600"]
          resources: { limits: { nvidia.com/gpu: 2 } }
---
# Crash-looping: exits with an error 20 s after starting
apiVersion: apps/v1
kind: Deployment
metadata: { name: email, namespace: shop }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: email } }
  template:
    metadata: { labels: { app.kubernetes.io/name: email, team: shop } }
    spec:
      containers:
        - name: email
          image: busybox:1.36
          command: ["sh", "-c", "echo starting email; sleep 20; echo 'fatal: SMTP_PASSWORD not set' >&2; exit 1"]
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 32Mi } }
---
# A healthy app near its memory limit
apiVersion: apps/v1
kind: Deployment
metadata: { name: cart, namespace: shop }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: cart } }
  template:
    metadata: { labels: { app.kubernetes.io/name: cart, team: shop } }
    spec:
      containers:
        - name: cart
          image: python:3.12-slim
          command: ["python", "-c", "import time; b = bytearray(100 * 2**20); time.sleep(10**9)"]
          resources: { requests: { cpu: 10m, memory: 64Mi }, limits: { memory: 128Mi } }
