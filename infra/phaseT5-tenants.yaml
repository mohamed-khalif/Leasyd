AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase T5 tenant operations for the S3-native observability platform: the
  obs-tenant-admin Lambda (create tenants, rotate and revoke API keys,
  usage, full tenant deletion) and a 15-minute sweep that expires rotated
  keys and advances deletions. Requires obs-phase0 (redeployed for T5),
  obs-phase2 and obs-phaseT2. Deploy with infra/deploy-phaseT5.sh.

Parameters:
  StandardPlanId:
    Type: String
    Description: obs-phaseT2 output StandardPlanId (deploy-phaseT5.sh passes it).
  TestTinyPlanId:
    Type: String
  UserPoolId:
    Type: String
    Default: ""
    Description: obs-state output UserPoolId (customer logins); empty = no invite-user.
  RetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: >
      Full days of data kept (plus today, UTC). Keep equal to obs-phase4's RetentionDays (the
      query API never reads earlier) and below the data bucket's 35-day backstop.
  SettleMinutes:
    Type: Number
    Default: 20
    Description: >
      Gap between purge passes when deleting a tenant. Longer than a
      compaction worker's lease (16 min), so a pass that finds nothing
      proves no worker was still writing.

Resources:
  AdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-tenant-admin
      PermissionsBoundary: !Sub "arn:aws:iam::${AWS::AccountId}:policy/obs-boundary"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: tenant-admin
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Registry
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:Query, dynamodb:Scan,
                         dynamodb:DeleteItem]   # a deleted tenant's synthetic checks
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-tenants"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-tenants/index/by-tenant"
              - Sid: PurgeIndex        # tenant deletion, and retention (index entries by day)
                Effect: Allow
                Action: [dynamodb:Scan, dynamodb:Query, dynamodb:GetItem, dynamodb:BatchWriteItem, dynamodb:DeleteItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-index"
              - Sid: ReadUsage
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-usage"
              - Sid: PurgeData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}"
              - Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/_incoming/*"
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/*"
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/synthetics/*"   # browser checks' screenshots
              - Sid: ApiKeys
                Effect: Allow
                Action: [apigateway:GET, apigateway:POST, apigateway:PATCH, apigateway:PUT, apigateway:DELETE]
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys/*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
              - Sid: Streams
                Effect: Allow
                Action: [firehose:CreateDeliveryStream, firehose:DeleteDeliveryStream,
                         firehose:DescribeDeliveryStream, firehose:TagDeliveryStream,
                         firehose:UpdateDestination]   # tune: buffer interval
                Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/obs-t-*"
              - Sid: StreamRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-firehose"
                Condition:
                  StringEquals: { "iam:PassedToService": firehose.amazonaws.com }
              - Sid: UserLogins     # invite-user / remove-user, and tenant deletion
                Effect: Allow
                Action: [cognito-idp:AdminCreateUser, cognito-idp:AdminDeleteUser,
                         cognito-idp:AdminUserGlobalSignOut]
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Sid: ContinuePurge
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-tenant-admin"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "T5" }

  AdminLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/obs-tenant-admin
      RetentionInDays: 90

  AdminFunction:
    Type: AWS::Lambda::Function
    DependsOn: AdminLogGroup
    Properties:
      FunctionName: obs-tenant-admin
      Description: Tenant operations - create, rotate/revoke keys, usage, delete
      Runtime: python3.12
      Architectures: [arm64]
      Handler: admin.handler
      Code: ../services/tenants/build
      Role: !GetAtt AdminRole.Arn
      MemorySize: 512
      Timeout: 900
      Environment:
        Variables:
          TENANTS_TABLE: obs-tenants
          INDEX_TABLE: obs-index
          USAGE_TABLE: obs-usage
          BUCKET: !Sub "obs-data-${AWS::AccountId}-${AWS::Region}"
          FIREHOSE_ROLE_ARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-firehose"
          USAGE_PLANS: !Sub '{"standard": "${StandardPlanId}", "test-tiny": "${TestTinyPlanId}"}'
          SETTLE_MINUTES: !Ref SettleMinutes
          RETENTION_DAYS: !Ref RetentionDays
          USER_POOL_ID: !Ref UserPoolId
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "T5" }

  # Async self-invocations (purge continuations) retry on failure; a pass
  # that still fails is retried by the sweep.
  AdminInvokeConfig:
    Type: AWS::Lambda::EventInvokeConfig
    Properties:
      FunctionName: !Ref AdminFunction
      Qualifier: $LATEST
      MaximumRetryAttempts: 2

  SweepSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: obs-tenant-sweep
      Description: Expire rotated keys and advance tenant deletions
      ScheduleExpression: rate(15 minutes)
      State: ENABLED
      Targets:
        - Id: admin
          Arn: !GetAtt AdminFunction.Arn
          Input: '{"action": "sweep"}'

  # Daily, early UTC: delete every active tenant's data older than RetentionDays.
  RetentionSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: obs-tenant-retention
      Description: Delete tenants' data older than the retention period
      ScheduleExpression: cron(17 1 * * ? *)
      State: ENABLED
      Targets:
        - Id: admin
          Arn: !GetAtt AdminFunction.Arn
          Input: '{"action": "retention"}'

  RetentionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RetentionSchedule.Arn

  SweepPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AdminFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepSchedule.Arn

Outputs:
  AdminFunction:
    Value: !Ref AdminFunction
