AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 0 foundation for the S3-native observability platform:
  data bucket with lifecycle rules, per-component IAM roles under a
  permissions boundary, and an account-wide cost budget.
  See docs/observability-plan.md.

Parameters:
  BudgetEmail:
    Type: String
    Default: AWSkhalif@gmail.com
    Description: Email address that receives budget alerts.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  BudgetLimitUsd:
    Type: Number
    Default: 50
    Description: Monthly account-wide budget in USD.
  EnableLifecycleTest:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Adds a rule moving _lifecycle-test/ objects to Glacier Instant Retrieval
      after 1 day, so the lifecycle mechanism can be verified quickly.
      (Standard-IA transitions cannot be shorter than 30 days.)
  AllowTestAssume:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Lets IAM principals in this account assume the component roles,
      so the Phase 0 deny tests can run. Set to false once tests pass.

Conditions:
  LifecycleTest: !Equals [!Ref EnableLifecycleTest, "true"]
  TestAssume: !Equals [!Ref AllowTestAssume, "true"]

Resources:
  # ---------- Storage ----------

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "obs-data-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # S3 request metrics in CloudWatch (incl. 5xx/503 SlowDown) for the
      # write path. Billed as custom CloudWatch metrics, a few $/month.
      MetricsConfigurations:
        - Id: incoming
          Prefix: _incoming/
      LifecycleConfiguration:
        Rules:
          # Compacted data only (data/tenant=<T>/<signal>/...). _incoming/
          # gets no transitions or expiry: a stuck compaction must never
          # silently lose data.
          - Id: data-tiering
            Status: Enabled
            Prefix: data/
            Transitions:
              - { StorageClass: STANDARD_IA, TransitionInDays: 30 }
              - { StorageClass: GLACIER_IR, TransitionInDays: 180 }
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - !If
            - LifecycleTest
            - Id: lifecycle-test
              Status: Enabled
              Prefix: _lifecycle-test/
              Transitions:
                - { StorageClass: GLACIER_IR, TransitionInDays: 1 }
            - !Ref AWS::NoValue
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  # Lambda bundles uploaded by `aws cloudformation package`.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "obs-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # ---------- IAM ----------

  # Upper bound on what any platform role can ever do, whatever
  # policies are later attached to it.
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: obs-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DataBucket
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:GetBucketLocation            # Firehose delivery (T2)
              - s3:ListBucketMultipartUploads   # Firehose delivery (T2)
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
          - Sid: PlatformTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
            Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-*"
          - Sid: PlatformCompute
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - states:StartExecution
              - states:DescribeExecution
            Resource:
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-*"
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:obs-*"
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:obs-*"
          - Sid: TenantIngestStreams
            Effect: Allow
            Action:
              - firehose:PutRecord
              - firehose:PutRecordBatch
            Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/obs-t-*"
          - Sid: TenantScopedReads
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
          - Sid: Telemetry
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - cloudwatch:PutMetricData
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-collector
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: write-incoming
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${DataBucket.Arn}/_incoming/*"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  CompactionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-compaction
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: compact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
              - Sid: ConsumeIncoming
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "${DataBucket.Arn}/_incoming/*"
              - Sid: WriteCompacted
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${DataBucket.Arn}/data/*"
              - Sid: WriteIndex
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:GetItem     # chunk plans
                  - dynamodb:UpdateItem  # mark a plan committed
                  - dynamodb:DeleteItem  # plans and leases
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-index"
              - Sid: InvokeWorker
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-compaction-worker"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-query
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: query
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # No direct access to tenant data or the index: every read goes
              # through obs-tenant-reader, tagged with the one tenant it serves.
              - Sid: AssumeTenantReader
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
              - Sid: LargeResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${DataBucket.Arn}/_results/*"
              - Sid: ResultCache
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-cache"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  # Reads one tenant's data and index entries. The tenant comes from the
  # session tag set when the query role assumes this role; IAM itself then
  # refuses any object or index key belonging to another tenant, whatever
  # the calling code asks for.
  TenantReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-tenant-reader
      PermissionsBoundary: !Ref PermissionsBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt QueryRole.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringLike: { "aws:RequestTag/tenant": "?*" }
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: [sts:AssumeRole, sts:TagSession]
              Condition:
                StringLike: { "aws:RequestTag/tenant": "?*" }
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: one-tenant
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadTenantData
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DataBucket.Arn}/data/tenant=${!aws:PrincipalTag/tenant}/*"
              - Sid: ListTenantData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": "data/tenant=${aws:PrincipalTag/tenant}/*" }
              - Sid: ReadTenantIndex
                Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-index"
                Condition:
                  ForAllValues:StringLike: { "dynamodb:LeadingKeys": "${aws:PrincipalTag/tenant}#*" }
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "T" }

  # ---------- Cost guardrail ----------

  AccountBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: obs-account-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  BucketName:
    Value: !Ref DataBucket
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  CollectorRoleArn:
    Value: !GetAtt CollectorRole.Arn
  CompactionRoleArn:
    Value: !GetAtt CompactionRole.Arn
  QueryRoleArn:
    Value: !GetAtt QueryRole.Arn
  TenantReaderRoleArn:
    Value: !GetAtt TenantReaderRole.Arn
  PermissionsBoundaryArn:
    Value: !Ref PermissionsBoundary
