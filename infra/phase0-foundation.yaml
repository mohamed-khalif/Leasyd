AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 0 foundation for the S3-native observability platform:
  per-component IAM roles under a permissions boundary, the Lambda
  artifacts bucket and an account-wide cost budget. The data bucket is in
  obs-state (infra/state.yaml).
  See docs/observability-plan.md.

Parameters:
  BudgetEmail:
    Type: String
    Default: AWSkhalif@gmail.com
    Description: Email address that receives budget alerts.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  BudgetLimitUsd:
    Type: Number
    Default: 50
    Description: Monthly account-wide budget in USD.
  AllowTestAssume:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Lets IAM principals in this account assume the component roles,
      so the Phase 0 deny tests can run. Set to false once tests pass.

Conditions:
  TestAssume: !Equals [!Ref AllowTestAssume, "true"]

Resources:
  # The data bucket lives in obs-state (infra/state.yaml).

  # Lambda bundles uploaded by `aws cloudformation package`.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "obs-artifacts-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-bundles
            Status: Enabled
            ExpirationInDays: 30
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  # ---------- IAM ----------

  # Upper bound on what any platform role can ever do, whatever
  # policies are later attached to it.
  PermissionsBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: obs-boundary
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DataBucket
            Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:AbortMultipartUpload
              - s3:GetBucketLocation            # Firehose delivery (T2)
              - s3:ListBucketMultipartUploads   # Firehose delivery (T2)
            Resource:
              - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}"
              - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/*"
          - Sid: PlatformTables
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:BatchGetItem
              - dynamodb:Query
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
              - dynamodb:BatchWriteItem
              - dynamodb:Scan                   # tenant admin: list tenants, purge a tenant (T5)
            Resource:
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-*"
              - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-*/index/*"
          - Sid: PlatformCompute
            Effect: Allow
            Action:
              - lambda:InvokeFunction
              - states:StartExecution
              - states:DescribeExecution
            Resource:
              - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-*"
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:obs-*"
              - !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:execution:obs-*"
          - Sid: TenantIngestStreams
            Effect: Allow
            Action:
              - firehose:PutRecord
              - firehose:PutRecordBatch
            Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/obs-t-*"
          # Tenant operations (T5, obs-tenant-admin): API keys, per-tenant
          # ingest streams and the role they deliver with.
          - Sid: TenantAdmin
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PATCH
              - apigateway:PUT
              - apigateway:DELETE
            Resource:
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans/*/keys/*"
              - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
          - Sid: TenantAdminStreams
            Effect: Allow
            Action:
              - firehose:CreateDeliveryStream
              - firehose:DeleteDeliveryStream
              - firehose:DescribeDeliveryStream
              - firehose:TagDeliveryStream
              - firehose:UpdateDestination      # tenant tune: buffer interval
            Resource: !Sub "arn:aws:firehose:${AWS::Region}:${AWS::AccountId}:deliverystream/obs-t-*"
          - Sid: TenantAdminPassFirehoseRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-firehose"
            Condition:
              StringEquals: { "iam:PassedToService": firehose.amazonaws.com }
          - Sid: TenantScopedReads
            Effect: Allow
            Action:
              - sts:AssumeRole
              - sts:TagSession
            Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
          - Sid: UserLogins            # tenant admin manages customer logins (U1)
            Effect: Allow
            Action:
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminUserGlobalSignOut
            Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
          - Sid: FailedEventQueues     # dead-letter queues (fast lane)
            Effect: Allow
            Action: sqs:SendMessage
            Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:obs-*"
          - Sid: CheckSecrets          # synthetic checks' secrets (S1), by the key's alias
            Effect: Allow
            Action: [kms:Encrypt, kms:Decrypt]
            Resource: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:key/*"
            Condition:
              ForAnyValue:StringEquals: { "kms:ResourceAliases": alias/obs-checks }
          - Sid: ImageBuildSource      # CodeBuild reads the browser-check image's source (S1)
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::obs-artifacts-${AWS::AccountId}-${AWS::Region}/builds/*"
          - Sid: ImageBuildLogin       # ... logs in to ECR (this action has no resource)
            Effect: Allow
            Action: ecr:GetAuthorizationToken
            Resource: "*"
          - Sid: ImageBuildPush        # ... and pushes the image to the platform's own repositories only
            Effect: Allow
            Action:
              - ecr:BatchCheckLayerAvailability
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/obs-*"
          - Sid: PeopleEmail           # invitations and sign-up emails (T5), from the platform's SES domain
            Effect: Allow
            Action: [ses:SendEmail, ses:SendRawEmail]
            Resource:
              - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
              - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/*"
          - Sid: CustomerAlertEmail    # alerts (A1): one SNS topic per customer email channel
            Effect: Allow
            Action: [sns:CreateTopic, sns:TagResource, sns:Subscribe, sns:Publish, sns:DeleteTopic, sns:ListSubscriptionsByTopic]
            Resource: !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:obs-alert-*"
          - Sid: PlatformParameters    # e.g. the canary tenant's API key (SecureString)
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/obs/*"
          - Sid: Telemetry
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - cloudwatch:PutMetricData
              - xray:PutTraceSegments
              - xray:PutTelemetryRecords
            Resource: "*"

  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-collector
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: write-incoming
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/_incoming/*"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  CompactionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-compaction
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: compact
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}"
              - Sid: ConsumeIncoming
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/_incoming/*"
              - Sid: WriteCompacted
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/*"
              - Sid: WriteIndex
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:Query
                  - dynamodb:GetItem     # chunk plans
                  - dynamodb:BatchGetItem  # raw-file records, when retiring fast-lane entries
                  - dynamodb:UpdateItem  # mark a plan committed
                  - dynamodb:DeleteItem  # plans and leases
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-index"
              - Sid: RetireBloomFiles   # fast-lane files once compacted; day-filter housekeeping
                Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/tenant=*/*/_fast/*"      # fast-lane Parquet and blooms
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/tenant=*/*/_bloom/raw-*"  # blooms of the earlier fast lane
                  # day filters (T6): old versions, and ID digests once no longer needed
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/tenant=*/*/_bloom/day/*"
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/tenant=*/*/_ids/*"
              - Sid: MeterUsage       # one usage record per compacted chunk (T5)
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-usage"
              - Sid: InvokeWorker
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-compaction-worker"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
              - Sid: FastLaneFailures   # failed fast-lane events (Lambda on-failure destination)
                Effect: Allow
                Action: sqs:SendMessage
                Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:obs-fastlane-failed"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  QueryRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-query
      PermissionsBoundary: !Ref PermissionsBoundary
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: sts:AssumeRole
            - !Ref AWS::NoValue
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: query
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # No direct access to tenant data or the index: every read goes
              # through obs-tenant-reader, tagged with the one tenant it serves.
              - Sid: AssumeTenantReader
                Effect: Allow
                Action:
                  - sts:AssumeRole
                  - sts:TagSession
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/obs-tenant-reader"
              - Sid: FanOutQueryWorkers   # Phase 4: the query coordinator runs workers in parallel
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:obs-query-worker"
              - Sid: LargeResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/_results/*"
              - Sid: ResultCache
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-cache"
              # Synthetic runs excluded by hand (exclude#<tenant>#...), so PromQL's check_excluded=""
              # leaves them out as the check pages do. Only this index, only queries.
              - Sid: ExcludedRuns
                Effect: Allow
                Action: dynamodb:Query
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-tenants/index/by-tenant"
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "0" }

  # Reads one tenant's data and index entries. The tenant comes from the
  # session tag set when the query role assumes this role; IAM itself then
  # refuses any object or index key belonging to another tenant, whatever
  # the calling code asks for.
  TenantReaderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: obs-tenant-reader
      PermissionsBoundary: !Ref PermissionsBoundary
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt QueryRole.Arn
            Action: [sts:AssumeRole, sts:TagSession]
            Condition:
              StringLike: { "aws:RequestTag/tenant": "?*" }
          - !If
            - TestAssume
            - Effect: Allow
              Principal:
                AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
              Action: [sts:AssumeRole, sts:TagSession]
              Condition:
                StringLike: { "aws:RequestTag/tenant": "?*" }
            - !Ref AWS::NoValue
      Policies:
        - PolicyName: one-tenant
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadTenantData
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/data/tenant=${!aws:PrincipalTag/tenant}/*"
                  # Raw files not yet compacted (the fast lane, T3).
                  - !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}/_incoming/tenant=${!aws:PrincipalTag/tenant}/*"
              - Sid: ListTenantData
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub "arn:aws:s3:::obs-data-${AWS::AccountId}-${AWS::Region}"
                Condition:
                  StringLike: { "s3:prefix": "data/tenant=${aws:PrincipalTag/tenant}/*" }
              - Sid: ReadTenantIndex
                Effect: Allow
                Action: [dynamodb:Query, dynamodb:GetItem]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/obs-index"
                Condition:
                  ForAllValues:StringLike: { "dynamodb:LeadingKeys": "${aws:PrincipalTag/tenant}#*" }
      Tags:
        - { Key: project, Value: obs }
        - { Key: phase, Value: "T" }

  # ---------- Cost guardrail ----------

  AccountBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: obs-account-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref BudgetEmail }

Outputs:
  ArtifactsBucketName:
    Value: !Ref ArtifactsBucket
  CollectorRoleArn:
    Value: !GetAtt CollectorRole.Arn
  CompactionRoleArn:
    Value: !GetAtt CompactionRole.Arn
  QueryRoleArn:
    Value: !GetAtt QueryRole.Arn
  TenantReaderRoleArn:
    Value: !GetAtt TenantReaderRole.Arn
  PermissionsBoundaryArn:
    Value: !Ref PermissionsBoundary
