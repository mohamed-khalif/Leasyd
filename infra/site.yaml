AWSTemplateFormatVersion: "2010-09-09"
Description: >
  The public website (obs-site): www.<domain> served from a private S3 bucket through CloudFront,
  with its own DNS zone (delegated by the domain's DNS provider with 4 NS records, like app. and
  ingest.) and TLS certificate. The bare domain stays with its DNS provider, which forwards it to
  https://www.<domain>; email is not affected. Pages are the files in site/ (deployed by
  infra/deploy-site.sh); /pricing serves pricing.html. Never deleted by infra/down.sh.

Parameters:
  DomainName:
    Type: String
    Description: The product's domain, e.g. leasyd.com.
    AllowedPattern: "^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
  IssueCertificate:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: true once the domain's DNS delegates www.<domain> to this stack's zone.

Conditions:
  Certificate: !Equals [!Ref IssueCertificate, "true"]

Resources:
  WwwZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "www.${DomainName}"
      HostedZoneConfig: { Comment: Leasyd website }
      HostedZoneTags:
        - { Key: project, Value: obs }

  Cert:
    Type: AWS::CertificateManager::Certificate
    Condition: Certificate
    Properties:
      DomainName: !Sub "www.${DomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - { DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref WwwZone }
      Tags:
        - { Key: project, Value: obs }

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "obs-site-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: project, Value: obs }

  SiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "obs-site-${AWS::Region}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals: { "AWS:SourceArn": !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}" }

  # /pricing -> /pricing.html, /docs/ -> /docs/index.html
  PrettyUrls:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "obs-site-urls-${AWS::Region}"
      AutoPublish: true
      FunctionConfig: { Comment: Pretty URLs for the website, Runtime: cloudfront-js-2.0 }
      FunctionCode: |
        function handler(event) {
          var r = event.request;
          if (r.uri.endsWith("/")) { r.uri += "index.html"; }
          else if (r.uri.lastIndexOf(".") < r.uri.lastIndexOf("/")) { r.uri += ".html"; }
          return r;
        }

  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "obs-site-security-${AWS::Region}"
        SecurityHeadersConfig:
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, Override: true }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Leasyd website
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Aliases: !If [Certificate, [!Sub "www.${DomainName}"], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - Certificate
          - { AcmCertificateArn: !Ref Cert, SslSupportMethod: sni-only, MinimumProtocolVersion: TLSv1.2_2021 }
          - !Ref AWS::NoValue
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteAccess.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6          # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt PrettyUrls.FunctionMetadata.FunctionARN }
        CustomErrorResponses:   # a missing page (S3 answers 403 without list rights)
          - { ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
          - { ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60 }
      Tags:
        - { Key: project, Value: obs }

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Condition: Certificate
    Properties:
      HostedZoneId: !Ref WwwZone
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2   # CloudFront's zone, the same for every distribution

Outputs:
  DomainName:
    Value: !Ref DomainName
  NameServers:
    Value: !Join [" ", !GetAtt WwwZone.NameServers]
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [Certificate, !Sub "https://www.${DomainName}", !Sub "https://${Distribution.DomainName}"]
  CertificateArn:
    Value: !If [Certificate, !Ref Cert, ""]
